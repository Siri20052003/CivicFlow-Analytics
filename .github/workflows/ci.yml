name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civicflow_test
          POSTGRES_USER: civicflow
          POSTGRES_PASSWORD: civicflow-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicflow -d civicflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres]"
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: PostgreSQL migration, concurrency, and recovery rehearsal
        env:
          CIVICFLOW_TEST_POSTGRES_URL: postgresql://civicflow:civicflow-test-password@127.0.0.1:5432/civicflow_test
          CIVICFLOW_DATABASE_URL: postgresql://civicflow:civicflow-test-password@127.0.0.1:5432/civicflow_test
        run: |
          pytest -q tests/test_postgres_integration.py
          civicflow-recovery \
            --backup-path /tmp/civicflow-recovery.dump \
            --report-path /tmp/civicflow-recovery-report.json \
            --rehearsal-database civicflow_rehearsal_ci
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/civicflow-recovery-report.json').read_text())
          assert report['status'] == 'pass'
          assert report['cleanup_status'] == 'dropped'
          assert report['source_tables'] == report['restored_tables']
          assert report['backup_bytes'] == Path('/tmp/civicflow-recovery.dump').stat().st_size
          assert all(check['status'] == 'pass' for check in report['checks'])
          PY
      - run: python -m build --wheel
      - name: Reproducible pipeline smoke test
        run: civicflow --cases 5000 --seed 20260922 --output-dir /tmp/civicflow
      - name: Validate warehouse reconciliation
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path
          import joblib
          import pandas as pd
          connection = sqlite3.connect('/tmp/civicflow/civicflow.db')
          cases = connection.execute('SELECT COUNT(*) FROM dim_case').fetchone()[0]
          states = connection.execute('SELECT COUNT(*) FROM current_case_state').fetchone()[0]
          assert cases == states == 5000
          with open('/tmp/civicflow/district_service_report.json') as handle:
              districts = json.load(handle)
          assert len(districts) == 10
          for district in districts:
              if district['compliance_rate'] is not None:
                  assert district['confidence_lower'] <= district['compliance_rate']
                  assert district['compliance_rate'] <= district['confidence_upper']
          with open('/tmp/civicflow/sla_prediction_report.json') as handle:
              prediction = json.load(handle)
          assert 0.5 <= prediction['roc_auc'] <= 1
          assert prediction['training_period_end'] < prediction['test_period_start']
          assert prediction['drift_level'] in {'stable', 'watch', 'action_required'}
          scores = pd.read_csv('/tmp/civicflow/open_case_risk_scores.csv')
          assert scores['risk_probability'].between(0, 1).all()
          assert scores['risk_probability'].is_monotonic_decreasing
          assert Path('/tmp/civicflow/sla_risk_model.joblib').stat().st_size > 0
          assert hasattr(joblib.load('/tmp/civicflow/sla_risk_model.joblib'), 'predict_proba')
          with open('/tmp/civicflow/staffing_scenario_report.json') as handle:
              staffing = json.load(handle)
          assert len(staffing['reports']) == 3
          for scenario in staffing['reports']:
              assert scenario['required_fte'] == sum(
                  row['required_fte'] for row in scenario['forecasts']
              )
              assert scenario['fte_gap'] == scenario['required_fte'] - scenario['current_fte']
              assert scenario['annualized_cost_delta'] == sum(
                  row['annualized_cost_delta'] for row in scenario['forecasts']
              )
          with open('/tmp/civicflow/staffing_backtest_report.json') as handle:
              backtest = json.load(handle)
          assert backtest['validation_weeks'] == 4
          assert len(backtest['departments']) == 5
          assert 0 <= backtest['planning_coverage_rate'] <= 1
          assert all(row['validation_weeks'] == 4 for row in backtest['departments'])
          with open('/tmp/civicflow/forecast_monitoring_report.json') as handle:
              monitoring = json.load(handle)
          assert monitoring['status'] in {'pass', 'action_required'}
          assert len(monitoring['checks']) == 4
          assert len(monitoring['departments']) == 5
          with open('/tmp/civicflow/assumption_audit_report.json') as handle:
              audit = json.load(handle)
          assert audit['status'] == 'verified'
          assert audit['current_assumptions_match'] is True
          assert audit['versions'] >= 2
          PY
      - name: Validate immutable briefing snapshot
        run: |
          civicflow-snapshot \
            --source-dir /tmp/civicflow \
            --snapshot-dir /tmp/civicflow-snapshots \
            --as-of 2026-10-03T13:00:00Z
          python - <<'PY'
          import json
          from pathlib import Path
          from civicflow.snapshots import verify_snapshot
          root = Path('/tmp/civicflow-snapshots')
          snapshots = [path for path in root.iterdir() if path.is_dir()]
          assert len(snapshots) == 1
          manifest = verify_snapshot(snapshots[0])
          assert manifest['synthetic_data'] is True
          report = json.loads((root / 'retention-report.json').read_text())
          assert report['mode'] == 'dry_run'
          assert report['deleted_snapshot_ids'] == []
          PY
      - name: Validate portfolio visuals
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          visuals = list(Path('docs').glob('*.svg'))
          assert len(visuals) >= 6
          for visual in visuals:
              ET.parse(visual)
          print(f'validated {len(visuals)} SVG assets')
          PY
      - name: Dashboard analytics smoke test
        run: |
          CIVICFLOW_DB=/tmp/civicflow/civicflow.db streamlit run src/civicflow/dashboard.py \
            --server.headless=true --server.port=8501 &
          dashboard_pid=$!
          trap 'kill $dashboard_pid' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health') as response:
                      assert response.read() == b'ok'
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('dashboard failed health check')
          PY
      - name: API ingestion and concurrent load probe
        env:
          CIVICFLOW_API_KEY: civicflow-ci-probe-secret-2026
          CIVICFLOW_API_KEYS: >-
            {"ci-probe":{"token_sha256":"e1936fb79bd4a7004c3f2c583594874bf2bb75fc215b2bbc96603a308b6930f8","scopes":["cases:read","cases:write","ops:read"]}}
        run: |
          CIVICFLOW_DB=/tmp/civicflow-api.db civicflow-api &
          api_pid=$!
          trap 'kill $api_pid' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health/ready') as response:
                      assert response.status == 200
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('API failed readiness check')
          PY
          python scripts/load_probe.py --requests 250 --concurrency 16 --max-p95-ms 2000
      - run: docker build -f Dockerfile.dashboard -t civicflow-dashboard .
      - run: docker build -f Dockerfile.api -t civicflow-api .
