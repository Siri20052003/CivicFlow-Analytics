<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">CivicFlow executive briefing and governed export preview</title>
  <desc id="desc">A portfolio preview showing executive KPI cards, priority actions, capacity planning, and a governed downloadable extract bundle.</desc>
  <rect width="1200" height="700" rx="28" fill="#e9f0f5"/>
  <rect x="55" y="45" width="1090" height="610" rx="22" fill="#ffffff" stroke="#d1dde6" stroke-width="2"/>
  <text x="95" y="100" fill="#176b87" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">MUNICIPAL OPERATIONS DECISION SUPPORT</text>
  <text x="95" y="145" fill="#102235" font-family="Arial, sans-serif" font-size="36" font-weight="700">CivicFlow executive briefing</text>
  <text x="95" y="176" fill="#60758a" font-family="Arial, sans-serif" font-size="17">Filter-aware evidence for service, risk, and workforce decisions</text>
  <g font-family="Arial, sans-serif">
    <rect x="95" y="215" width="225" height="115" rx="14" fill="#dff5f4"/>
    <text x="118" y="258" fill="#102235" font-size="30" font-weight="700">5,000</text>
    <text x="118" y="292" fill="#60758a" font-size="15">Selected synthetic cases</text>
    <rect x="340" y="215" width="225" height="115" rx="14" fill="#dff5f4"/>
    <text x="363" y="258" fill="#102235" font-size="30" font-weight="700">+22</text>
    <text x="363" y="292" fill="#60758a" font-size="15">Modeled FTE gap</text>
    <rect x="585" y="215" width="225" height="115" rx="14" fill="#dff5f4"/>
    <text x="608" y="258" fill="#102235" font-size="30" font-weight="700">Stable</text>
    <text x="608" y="292" fill="#60758a" font-size="15">Risk-model drift</text>
    <rect x="830" y="215" width="225" height="115" rx="14" fill="#fff3d2"/>
    <text x="853" y="258" fill="#102235" font-size="25" font-weight="700">Governed ZIP</text>
    <text x="853" y="292" fill="#60758a" font-size="15">Scoped + checksummed</text>

    <text x="95" y="380" fill="#102235" font-size="21" font-weight="700">Leadership actions</text>
    <circle cx="108" cy="419" r="7" fill="#176b87"/><text x="130" y="425" fill="#334e63" font-size="16">Triage currently breached cases using the calibrated risk queue.</text>
    <circle cx="108" cy="459" r="7" fill="#176b87"/><text x="130" y="465" fill="#334e63" font-size="16">Evaluate phased capacity against the largest department staffing gap.</text>
    <circle cx="108" cy="499" r="7" fill="#176b87"/><text x="130" y="505" fill="#334e63" font-size="16">Continue scheduled calibration monitoring while drift remains stable.</text>

    <rect x="95" y="548" width="460" height="62" rx="12" fill="#176b87"/>
    <text x="145" y="587" fill="#ffffff" font-size="17" font-weight="700">Download print-ready HTML briefing</text>
    <rect x="575" y="548" width="480" height="62" rx="12" fill="#102235"/>
    <text x="631" y="587" fill="#ffffff" font-size="17" font-weight="700">Download traceable operational bundle</text>
