<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CivicFlow API ingestion runtime</title>
  <desc id="desc">Authenticated case batches pass through scoped authorization, a validated API contract, and an atomic idempotent transaction into the operations warehouse, with protected metrics and public health signals sent to monitoring.</desc>
  <rect width="1200" height="620" rx="28" fill="#071827"/>
  <text x="70" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">CivicFlow ingestion runtime</text>
  <text x="70" y="108" fill="#9fb5c7" font-family="Arial, sans-serif" font-size="18">Hashed service auth • bounded contracts • durable replay safety • observable operations</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="190" width="220" height="170" rx="18" fill="#12324a" stroke="#38bdf8" stroke-width="2"/>
    <text x="95" y="235" fill="#7dd3fc" font-size="17" font-weight="700">CASE SYSTEMS</text>
    <text x="95" y="278" fill="#f8fafc" font-size="23" font-weight="700">Batch request</text>
    <text x="95" y="313" fill="#c8d7e3" font-size="16">Cases + lifecycle events</text>
    <text x="95" y="338" fill="#c8d7e3" font-size="16">Durable request_id</text>
    <rect x="370" y="160" width="260" height="230" rx="18" fill="#12324a" stroke="#a78bfa" stroke-width="2"/>
    <text x="395" y="205" fill="#c4b5fd" font-size="17" font-weight="700">FASTAPI BOUNDARY</text>
    <text x="395" y="248" fill="#f8fafc" font-size="23" font-weight="700">Authenticated contract</text>
    <text x="395" y="283" fill="#c8d7e3" font-size="16">SHA-256 bearer verification</text>
    <text x="395" y="309" fill="#c8d7e3" font-size="16">Read / write / ops scopes</text>
    <text x="395" y="335" fill="#c8d7e3" font-size="16">Lifecycle + correlation checks</text>
    <text x="395" y="361" fill="#c8d7e3" font-size="16">401 / 403 / 409 / 422</text>
    <rect x="710" y="160" width="260" height="230" rx="18" fill="#12324a" stroke="#34d399" stroke-width="2"/>
    <text x="735" y="205" fill="#6ee7b7" font-size="17" font-weight="700">SQLITE TRANSACTION</text>
    <text x="735" y="248" fill="#f8fafc" font-size="23" font-weight="700">Atomic append</text>
    <text x="735" y="283" fill="#c8d7e3" font-size="16">BEGIN IMMEDIATE</text>
    <text x="735" y="309" fill="#c8d7e3" font-size="16">Case + event foreign keys</text>
    <text x="735" y="335" fill="#c8d7e3" font-size="16">Payload fingerprint receipt</text>
    <text x="735" y="361" fill="#c8d7e3" font-size="16">Exact replay returns safely</text>
    <rect x="1030" y="190" width="110" height="170" rx="18" fill="#12324a" stroke="#fbbf24" stroke-width="2"/>
    <text x="1052" y="235" fill="#fde68a" font-size="15" font-weight="700">QUERY</text>
    <text x="1052" y="278" fill="#f8fafc" font-size="18" font-weight="700">Current</text>
    <text x="1052" y="303" fill="#f8fafc" font-size="18" font-weight="700">case</text>
    <text x="1052" y="328" fill="#f8fafc" font-size="18" font-weight="700">state</text>
    <path d="M290 275 H370" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M630 275 H710" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M970 275 H1030" stroke="#34d399" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="370" y="455" width="600" height="105" rx="18" fill="#0d2639" stroke="#5f7f96" stroke-width="2"/>
    <text x="400" y="495" fill="#f8fafc" font-size="20" font-weight="700">Operations plane</text>
    <text x="400" y="529" fill="#b9cad6" font-size="16">/health/live + /health/ready</text>
    <text x="690" y="529" fill="#b9cad6" font-size="16">Protected /metrics + auth load probe</text>
    <path d="M500 390 V455" stroke="#a78bfa" stroke-width="3"/>
    <path d="M840 390 V455" stroke="#34d399" stroke-width="3"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d9e7ef"/>
    </marker>
  </defs>
</svg>
