[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "civicflow-analytics"
version = "0.1.0"
description = "Auditable synthetic public-service case generation and SLA analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Siri Chandana Ponnamaneni" }]
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.41,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
civicflow = "civicflow.cli:main"
civicflow-api = "civicflow.api:run"
civicflow-dashboard = "civicflow.dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civicflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
